<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elev8 Comply — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f1f5f9; color: #0f172a; padding: 24px; box-sizing: border-box; text-align: center; }
    .card { max-width: 360px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: #1E40AF; color: #fff; font-weight: 800;
            font-size: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #475569; margin: 0 0 24px; line-height: 1.5; }
    a { display: inline-block; background: #1E40AF; color: #fff; text-decoration: none; padding: 12px 24px;
        border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">E8</div>
    <h1>You're offline</h1>
    <p>Elev8 Comply needs an internet connection. Check your Wi-Fi or cellular signal, then try again.</p>
    <a href="https://www.elev8comply.com">Try again</a>
  </div>
</body>
</html>
